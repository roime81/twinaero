version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: twinaero_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - twin-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: twinaero_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - twin-net

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: twinaero_timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: airlinetwin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - twin-net

  redis:
    image: redis:alpine
    container_name: twinaero_redis
    ports:
      - "6379:6379"
    networks:
      - twin-net

  ollama:
    image: ollama/ollama:latest
    container_name: twinaero_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - twin-net

  stream-worker:
    build: .
    container_name: twinaero_stream_worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql://postgres:password@timescaledb:5432/airlinetwin
    depends_on:
      - kafka
      - timescaledb
    networks:
      - twin-net

volumes:
  pgdata:
  ollama_data:

networks:
  twin-net:
    driver: bridge
